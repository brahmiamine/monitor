# Deux petits conteneurs sans privilèges autour du service système :
#  - docker-proxy : liste des conteneurs et statistiques en lecture seule, publié uniquement sur 127.0.0.1:2375 ;
#  - bridge : relie Caddy (réseau Docker clubika_internal) au socket Unix de l'application.
name: monitor

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: monitor-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"

  bridge:
    image: alpine/socat:1.8.1.1
    container_name: monitor-bridge
    restart: unless-stopped
    command: ["TCP-LISTEN:8000,fork,reuseaddr", "UNIX-CONNECT:/run/monitor/monitor.sock"]
    volumes:
      - /var/lib/monitor/run:/run/monitor
    networks:
      - clubika_internal

networks:
  clubika_internal:
    external: true
